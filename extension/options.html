<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Personal API — Settings</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { font-family: Inter, -apple-system, sans-serif; padding: 32px; max-width: 480px; color: #111827; }
		h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
		p { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
		label { display: block; font-size: 12px; font-weight: 600; color: #374151; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
		input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; }
		input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
		button { margin-top: 16px; padding: 10px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
		button:hover { background: #1d4ed8; }
		.saved { color: #16a34a; font-size: 13px; margin-top: 8px; display: none; }
	</style>
</head>
<body>
	<h1>Personal API Settings</h1>
	<p>Connect this extension to your Personal API instance.</p>
	
	<label for="api-url">API URL</label>
	<input type="url" id="api-url" placeholder="https://your-personal-api.com" />
	
	<button id="save">Save</button>
	<div class="saved" id="saved">Settings saved!</div>

	<script>
		const input = document.getElementById('api-url');
		const saveBtn = document.getElementById('save');
		const saved = document.getElementById('saved');

		chrome.storage.sync.get(['papi-api-url'], (result) => {
			input.value = result['papi-api-url'] || '';
		});

		saveBtn.onclick = () => {
			chrome.storage.sync.set({ 'papi-api-url': input.value.replace(/\/$/, '') }, () => {
				saved.style.display = 'block';
				setTimeout(() => saved.style.display = 'none', 2000);
			});
		};
	</script>
</body>
</html>
